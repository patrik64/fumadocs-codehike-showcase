<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="1160" height="300" rx="12" fill="#161b22"/>
  <text x="32" y="46" font-size="17" font-weight="600" fill="#c9d1d9">From MDX file to prerendered page</text>
  <text x="32" y="70" font-size="13" fill="#8b949e">Every step below runs at build time — the browser receives no syntax highlighter.</text>

  <g font-size="14" font-weight="600" fill="#c9d1d9">
    <g>
      <rect x="32" y="100" width="196" height="104" rx="10" fill="#0d1117" stroke="#30363d"/>
      <text x="48" y="130">content/docs/*.mdx</text>
      <text x="48" y="154" font-size="11.5" font-weight="400" fill="#8b949e">Prose, code fences,</text>
      <text x="48" y="170" font-size="11.5" font-weight="400" fill="#8b949e">## !!steps blocks and</text>
      <text x="48" y="186" font-size="11.5" font-weight="400" fill="#8b949e">// !mark comments</text>
    </g>
    <g>
      <rect x="258" y="100" width="196" height="104" rx="10" fill="#0d1117" stroke="#d2a8ff"/>
      <text x="274" y="130" fill="#d2a8ff">remarkCodeHike</text>
      <text x="274" y="154" font-size="11.5" font-weight="400" fill="#8b949e">Highlights the code and</text>
      <text x="274" y="170" font-size="11.5" font-weight="400" fill="#8b949e">parses comment</text>
      <text x="274" y="186" font-size="11.5" font-weight="400" fill="#8b949e">annotations into props</text>
    </g>
    <g>
      <rect x="484" y="100" width="196" height="104" rx="10" fill="#0d1117" stroke="#79c0ff"/>
      <text x="500" y="130" fill="#79c0ff">fumadocs-mdx</text>
      <text x="500" y="154" font-size="11.5" font-weight="400" fill="#8b949e">Frontmatter, page tree,</text>
      <text x="500" y="170" font-size="11.5" font-weight="400" fill="#8b949e">table of contents,</text>
      <text x="500" y="186" font-size="11.5" font-weight="400" fill="#8b949e">search index</text>
    </g>
    <g>
      <rect x="710" y="100" width="196" height="104" rx="10" fill="#0d1117" stroke="#30363d"/>
      <text x="726" y="130">Your components</text>
      <text x="726" y="154" font-size="11.5" font-weight="400" fill="#8b949e">Code, Scrollycoding,</text>
      <text x="726" y="170" font-size="11.5" font-weight="400" fill="#8b949e">Spotlight, Slideshow —</text>
      <text x="726" y="186" font-size="11.5" font-weight="400" fill="#8b949e">copied, then owned</text>
    </g>
    <g>
      <rect x="936" y="100" width="192" height="104" rx="10" fill="#0d1117" stroke="#7ee787"/>
      <text x="952" y="130" fill="#7ee787">Static HTML</text>
      <text x="952" y="154" font-size="11.5" font-weight="400" fill="#8b949e">One prerendered file</text>
      <text x="952" y="170" font-size="11.5" font-weight="400" fill="#8b949e">per route, plus an</text>
      <text x="952" y="186" font-size="11.5" font-weight="400" fill="#8b949e">llms.mdx twin</text>
    </g>
  </g>

  <g stroke="#6e7681" stroke-width="1.5" fill="none">
    <path d="M232 152h18m0 0-6-5m6 5-6 5"/>
    <path d="M458 152h18m0 0-6-5m6 5-6 5"/>
    <path d="M684 152h18m0 0-6-5m6 5-6 5"/>
    <path d="M910 152h18m0 0-6-5m6 5-6 5"/>
  </g>

  <text x="32" y="250" font-size="12" fill="#8b949e">Token colors resolve to the --ch-* CSS variables in app/app.css, so highlighted code follows the light/dark toggle without re-highlighting.</text>
  <text x="32" y="272" font-size="12" fill="#8b949e">Click this image to zoom — that is fumadocs' ImageZoom component doing the work.</text>
</svg>
