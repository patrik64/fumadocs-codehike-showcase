<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="1160" height="300" rx="12" fill="#f6f8fa"/>
  <text x="32" y="46" font-size="17" font-weight="600" fill="#24292f">From MDX file to prerendered page</text>
  <text x="32" y="70" font-size="13" fill="#57606a">Every step below runs at build time — the browser receives no syntax highlighter.</text>

  <g font-size="14" font-weight="600" fill="#24292f">
    <g>
      <rect x="32" y="100" width="196" height="104" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="48" y="130">content/docs/*.mdx</text>
      <text x="48" y="154" font-size="11.5" font-weight="400" fill="#57606a">Prose, code fences,</text>
      <text x="48" y="170" font-size="11.5" font-weight="400" fill="#57606a">## !!steps blocks and</text>
      <text x="48" y="186" font-size="11.5" font-weight="400" fill="#57606a">// !mark comments</text>
    </g>
    <g>
      <rect x="258" y="100" width="196" height="104" rx="10" fill="#ffffff" stroke="#8250df"/>
      <text x="274" y="130" fill="#8250df">remarkCodeHike</text>
      <text x="274" y="154" font-size="11.5" font-weight="400" fill="#57606a">Highlights the code and</text>
      <text x="274" y="170" font-size="11.5" font-weight="400" fill="#57606a">parses comment</text>
      <text x="274" y="186" font-size="11.5" font-weight="400" fill="#57606a">annotations into props</text>
    </g>
    <g>
      <rect x="484" y="100" width="196" height="104" rx="10" fill="#ffffff" stroke="#0969da"/>
      <text x="500" y="130" fill="#0969da">fumadocs-mdx</text>
      <text x="500" y="154" font-size="11.5" font-weight="400" fill="#57606a">Frontmatter, page tree,</text>
      <text x="500" y="170" font-size="11.5" font-weight="400" fill="#57606a">table of contents,</text>
      <text x="500" y="186" font-size="11.5" font-weight="400" fill="#57606a">search index</text>
    </g>
    <g>
      <rect x="710" y="100" width="196" height="104" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="726" y="130">Your components</text>
      <text x="726" y="154" font-size="11.5" font-weight="400" fill="#57606a">Code, Scrollycoding,</text>
      <text x="726" y="170" font-size="11.5" font-weight="400" fill="#57606a">Spotlight, Slideshow —</text>
      <text x="726" y="186" font-size="11.5" font-weight="400" fill="#57606a">copied, then owned</text>
    </g>
    <g>
      <rect x="936" y="100" width="192" height="104" rx="10" fill="#ffffff" stroke="#1a7f37"/>
      <text x="952" y="130" fill="#1a7f37">Static HTML</text>
      <text x="952" y="154" font-size="11.5" font-weight="400" fill="#57606a">One prerendered file</text>
      <text x="952" y="170" font-size="11.5" font-weight="400" fill="#57606a">per route, plus an</text>
      <text x="952" y="186" font-size="11.5" font-weight="400" fill="#57606a">llms.mdx twin</text>
    </g>
  </g>

  <g stroke="#8c959f" stroke-width="1.5" fill="none">
    <path d="M232 152h18m0 0-6-5m6 5-6 5"/>
    <path d="M458 152h18m0 0-6-5m6 5-6 5"/>
    <path d="M684 152h18m0 0-6-5m6 5-6 5"/>
    <path d="M910 152h18m0 0-6-5m6 5-6 5"/>
  </g>

  <text x="32" y="250" font-size="12" fill="#57606a">Token colors resolve to the --ch-* CSS variables in app/app.css, so highlighted code follows the light/dark toggle without re-highlighting.</text>
  <text x="32" y="272" font-size="12" fill="#57606a">Click this image to zoom — that is fumadocs' ImageZoom component doing the work.</text>
</svg>
